<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-title" content="指南龟">
  <title>指南龟</title>
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="icon" type="image/png" href="icon-180.png">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="manifest" href="manifest.webmanifest">
  <style>
:root {
  --bg: #000000;
  --label: #8e8e93;
  --text: #ffffff;
  --muted: #636366;
  --accent: #0a84ff;
}

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  height: 100%;
  background: #000000;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Helvetica Neue", sans-serif;
  color: var(--text);
  background: radial-gradient(120% 80% at 50% 26%, #2c2c2e 0%, #101012 55%, #000000 100%);
  background-color: #000000;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  overflow: hidden;
}

#app {
  display: flex;
  flex-direction: column;
  height: 100vh;
  height: 100dvh;
  padding-top: calc(env(safe-area-inset-top, 0px) + 18px);
  padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 16px);
}

/* ---------- 顶部方向读数 ---------- */
.heading {
  text-align: center;
  padding: 4px 24px 8px;
}

.heading-degree {
  font-size: 64px;
  font-weight: 300;
  letter-spacing: -2px;
  line-height: 1;
  font-variant-numeric: tabular-nums;
}

.heading-direction {
  margin-top: 8px;
  font-size: 17px;
  color: var(--label);
  letter-spacing: 2px;
}

/* ---------- 指南针表盘 ---------- */
.compass-wrap {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 0;
  padding: 8px 0;
}

.compass-stage {
  position: relative;
  margin-top: -14px;
  width: 80vw;
  height: 80vw;
  max-width: 360px;
  max-height: 360px;
}

.dial-bg {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  border-radius: 50%;
  background: radial-gradient(circle at 50% 50%, #26262a 0%, #111113 62%, #050506 100%);
  box-shadow:
    0 18px 40px rgba(0, 0, 0, 0.55),
    0 0 0 1px rgba(255, 255, 255, 0.07) inset,
    0 2px 6px rgba(255, 255, 255, 0.04) inset;
}

.compass-dial {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  will-change: transform;
}

.compass-dial svg {
  width: 100%;
  height: 100%;
  display: block;
}
.needle {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 2;
}

.needle svg {
  width: 100%;
  height: 100%;
  display: block;
}

.city-line {
  margin-top: 48px;
  min-height: 29px;
  font-size: 25px;
  color: var(--label);
  letter-spacing: 1px;
}

.level-hint {
  margin-top: 14px;
  min-height: 18px;
  font-size: 13px;
  color: var(--muted);
  opacity: 0;
  transition: opacity 0.25s ease;
}

.level-hint.visible {
  opacity: 1;
}

/* ---------- 底部信息 ---------- */
.readout {
  text-align: center;
  padding: 12px 24px 0;
}

.readout .row {
  display: flex;
  align-items: baseline;
  justify-content: center;
  margin-bottom: 8px;
}

.readout .label {
  color: var(--label);
  font-size: 12px;
  letter-spacing: 2px;
  margin-right: 8px;
}

.readout .value {
  color: var(--text);
  font-size: 25px;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
}

.readout .coords {
  font-size: 19px;
  white-space: pre;
  font-weight: 500;
}

.readout .coords-decimal {
  color: var(--muted);
  font-size: 13px;
  font-weight: 400;
}

.readout .decimal-row {
  margin-bottom: 0;
}

  .level-hint.action {
  color: #ffd60a;
  font-size: 15px;
  font-weight: 600;
}

.level-hint.error {
  color: #ff453a;
  font-size: 14px;
  font-weight: 600;
}  .enable-btn {
  display: none;
  margin-top: 10px;
  padding: 12px 30px;
  border: 0;
  border-radius: 999px;
  background: #ffd60a;
  color: #000000;
  font-size: 15px;
  font-weight: 600;
}

.enable-btn.visible {
  display: inline-block;
}

/* ---------- 安卓安装到桌面 ---------- */
.install-banner {
  position: fixed;
  left: 12px;
  right: 12px;
  bottom: calc(12px + env(safe-area-inset-bottom, 0px));
  z-index: 30;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 10px 10px 12px;
  border-radius: 18px;
  background: rgba(28, 28, 30, 0.94);
  border: 1px solid rgba(255, 255, 255, 0.14);
  box-shadow: 0 12px 32px rgba(0, 0, 0, 0.65);
  opacity: 0;
  transform: translateY(18px);
  pointer-events: none;
  transition: opacity 0.3s ease, transform 0.3s ease;
}

.install-banner.visible {
  opacity: 1;
  transform: translateY(0);
  pointer-events: auto;
}

.install-banner img {
  width: 44px;
  height: 44px;
  border-radius: 11px;
  flex: 0 0 auto;
}

.install-banner .install-text {
  flex: 1 1 auto;
  min-width: 0;
}

.install-banner .install-title {
  font-size: 15px;
  font-weight: 600;
  color: var(--text);
}

.install-banner .install-sub {
  margin-top: 2px;
  font-size: 12px;
  color: var(--label);
}

.install-banner .install-go {
  flex: 0 0 auto;
  padding: 9px 18px;
  border: 0;
  border-radius: 999px;
  background: #ffd60a;
  color: #000000;
  font-size: 14px;
  font-weight: 600;
}

.install-banner .install-close {
  flex: 0 0 auto;
  width: 28px;
  height: 28px;
  border: 0;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.1);
  color: var(--label);
  font-size: 17px;
  line-height: 1;
  padding: 0;
}

.install-sheet {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 40;
  padding: 24px 20px calc(24px + env(safe-area-inset-bottom, 0px));
  border-radius: 22px 22px 0 0;
  background: #1c1c1e;
  border-top: 1px solid rgba(255, 255, 255, 0.14);
  box-shadow: 0 -12px 32px rgba(0, 0, 0, 0.65);
  opacity: 0;
  transform: translateY(100%);
  pointer-events: none;
  transition: opacity 0.3s ease, transform 0.3s ease;
}

.install-sheet.visible {
  opacity: 1;
  transform: translateY(0);
  pointer-events: auto;
}

.install-sheet h3 {
  margin: 0 0 4px;
  font-size: 17px;
  font-weight: 600;
  color: var(--text);
}

.install-sheet .install-browser {
  margin: 0 0 12px;
  font-size: 13px;
  color: var(--accent);
}

.install-sheet ol {
  margin: 0;
  padding-left: 20px;
  font-size: 14px;
  color: var(--text);
  line-height: 2;
}

.install-sheet .install-done {
  margin-top: 18px;
  width: 100%;
  padding: 12px;
  border: 0;
  border-radius: 12px;
  background: #ffd60a;
  color: #000000;
  font-size: 15px;
  font-weight: 600;
}
  </style>
</head>

  <script>
(function () {
  "use strict";

  var CARDINALS = ["北", "东北", "东", "东南", "南", "西南", "西", "西北"];

  var els = {
    dial: document.getElementById("dial"),
    degree: document.getElementById("degree"),
    direction: document.getElementById("direction"),
    altitude: document.getElementById("altitude"),
    coordinates: document.getElementById("coordinates"),
    coordinatesDecimal: document.getElementById("coordinatesDecimal"),
    enableBtn: document.getElementById("enableBtn"),
    levelHint: document.getElementById("levelHint"),
    cityLine: document.getElementById("cityLine")
  };

  var heading = null;
  var geoCoded = false;
  var demoMode = /[?&]demo=1/.test(window.location.search);

  window.addEventListener("error", function (e) {
    showHint("运行异常：" + (e.message || "未知错误"), "error");
  });

  /* ---------- 提示 ---------- */
  function showHint(text, kind) {
    if (!text) {
      els.levelHint.classList.remove("visible", "action", "error");
      return;
    }
    els.levelHint.textContent = text;
    els.levelHint.classList.remove("action", "error");
    if (kind === "action") {
      els.levelHint.classList.add("action");
    } else if (kind === "error") {
      els.levelHint.classList.add("error");
    }
    els.levelHint.classList.add("visible");
  }

  /* ---------- 方向 ---------- */
  function cardinal8(deg) {
    return CARDINALS[((Math.round(deg / 45) % 8) + 8) % 8];
  }

  function updateHeading(h) {
    heading = h;
    hideEnableButton();
    els.dial.style.transform = "rotate(" + (-h).toFixed(1) + "deg)";
    els.degree.textContent = Math.round(h) + "°";
    els.direction.textContent = cardinal8(h);
    showHint("", null);
  }

  function onOrientation(e) {
    var h = null;
    if (typeof e.webkitCompassHeading === "number" && !isNaN(e.webkitCompassHeading)) {
      h = e.webkitCompassHeading;
    } else if (e.absolute === true && typeof e.alpha === "number" && !isNaN(e.alpha)) {
      h = e.alpha;
    }
    if (h === null) {
      return;
    }
    updateHeading(h);

    var tilted = false;
    if (typeof e.beta === "number" && typeof e.gamma === "number") {
      tilted = Math.abs(e.beta) > 25 || Math.abs(e.gamma) > 25;
    }
    if (tilted) {
      showHint("将手机水平放置，方向更准确", null);
    }
  }

  /* ---------- 定位与海拔 ---------- */
  function pad2(n) {
    return String(n).padStart(2, "0");
  }

  function dms(value, posDir, negDir) {
    var dir = value >= 0 ? posDir : negDir;
    var total = Math.round(Math.abs(value) * 3600);
    var d = Math.floor(total / 3600);
    var m = Math.floor((total % 3600) / 60);
    var s = total % 60;
    return d + "°" + pad2(m) + "′" + pad2(s) + "″" + dir;
  }

  function renderPosition(coords) {
    if (typeof coords.altitude === "number" && coords.altitude !== null && !isNaN(coords.altitude)) {
      els.altitude.textContent = Math.round(coords.altitude) + " 米";
    } else {
      els.altitude.textContent = "获取中…";
    }

    if (typeof coords.latitude === "number" && typeof coords.longitude === "number") {
      els.coordinates.textContent = dms(coords.latitude, "N", "S") + "   " + dms(coords.longitude, "E", "W");
      els.coordinatesDecimal.textContent = coords.latitude.toFixed(5) + ", " + coords.longitude.toFixed(5);
      if (typeof coords.accuracy === "number" && coords.accuracy !== null) {
        els.coordinatesDecimal.textContent += "（约 ±" + Math.round(coords.accuracy) + " 米）";
      }
    }
  }

  function onPosition(pos) {
    renderPosition(pos.coords);
    maybeReverseGeocode(pos);
  }

  function onLocationError(err) {
    if (window.isSecureContext === false) {
      els.coordinates.textContent = "当前页面不是 HTTPS，Safari 已拦截定位";
      els.coordinatesDecimal.textContent = "请使用 GitHub Pages 部署地址打开";
    } else {
      els.coordinates.textContent = "无法获取位置";
      els.coordinatesDecimal.textContent = err && err.message ? err.message : "";
    }
    els.altitude.textContent = "—";
  }

  /* ---------- 城市区域（逆地理编码） ---------- */
  function maybeReverseGeocode(pos) {
    var acc = typeof pos.coords.accuracy === "number" ? pos.coords.accuracy : null;
    if (geoCoded || (acc !== null && acc > 1200)) {
      return;
    }
    geoCoded = true;
    reverseGeocode(pos.coords.latitude, pos.coords.longitude);
  }

  function reverseGeocode(lat, lon) {
    var url = "https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=" + lat + "&longitude=" + lon + "&localityLanguage=zh";
    fetch(url).then(function (r) {
      return r.json();
    }).then(function (d) {
      var parts = [];
      if (d.city) { parts.push(d.city); }
      if (d.locality && d.locality !== d.city) { parts.push(d.locality); }
      if (!parts.length && d.principalSubdivision) { parts.push(d.principalSubdivision); }
      if (!parts.length && d.countryName) { parts.push(d.countryName); }
      els.cityLine.textContent = parts.length ? parts.join(" ") : "未能识别所在区域";
    }).catch(function () {
      var u2 = "https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=" + lat + "&lon=" + lon + "&zoom=12&accept-language=zh-CN";
      fetch(u2).then(function (r) {
        return r.json();
      }).then(function (d) {
        var a = d.address || {};
        var parts = [];
        if (a.city) { parts.push(a.city); }
        else if (a.town) { parts.push(a.town); }
        var sub = a.suburb || a.city_district || a.county;
        if (sub && sub !== parts[0]) { parts.push(sub); }
        if (!parts.length && a.state) { parts.push(a.state); }
        els.cityLine.textContent = parts.length ? parts.join(" ") : (a.country || "未能识别所在区域");
      }).catch(function () {
        els.cityLine.textContent = "未能识别所在区域";
      });
    });
  }

    function startGeolocation() {
    if (!("geolocation" in navigator)) {
      onLocationError({ message: "此设备不支持定位" });
      return;
    }
    navigator.geolocation.watchPosition(onPosition, onLocationError, {
      enableHighAccuracy: true,
      maximumAge: 1500,
      timeout: 12000
    });
  }

      /* ---------- 方向权限 ---------- */
    /* ---------- 方向权限（每次打开都需点击按钮） ---------- */

  function hasRequestPermission() {
    return typeof DeviceOrientationEvent !== "undefined" &&
      typeof DeviceOrientationEvent.requestPermission === "function";
  }

  function showEnableButton() {
    if (heading !== null || demoMode) {
      return;
    }
    els.enableBtn.classList.add("visible");
    showHint("点击下方黄色按钮，启用方向", "action");
  }

  function hideEnableButton() {
    els.enableBtn.classList.remove("visible");
  }

  function scheduleNoDataCheck() {
    window.setTimeout(function () {
      if (heading === null && !demoMode) {
        showHint("转动手机获取方向；若仍无反应，请检查 Safari 网站设置", "action");
      }
    }, 6000);
  }

  function attachOrientationListeners() {
    window.addEventListener("deviceorientation", onOrientation, true);
    window.addEventListener("deviceorientationabsolute", onOrientation, true);
  }

  function onEnableClick() {
    hideEnableButton();
    if (typeof DeviceOrientationEvent === "undefined") {
      showHint("当前浏览器不支持方向传感器，请用 Safari 打开", "error");
      return;
    }
    if (hasRequestPermission()) {
      DeviceOrientationEvent.requestPermission().then(function (state) {
        if (state === "granted") {
          attachOrientationListeners();
          showHint("", null);
          scheduleNoDataCheck();
        } else if (state === "denied") {
          showHint("权限被拒绝：Safari 地址栏点 aA → 网站设置 允许，或清除网站数据后重试", "error");
          showEnableButton();
        } else {
          showEnableButton();
        }
      }).catch(function () {
        showEnableButton();
      });
    } else {
      attachOrientationListeners();
      showHint("", null);
      scheduleNoDataCheck();
    }
  }

  function startCompass() {
    startGeolocation();
    els.enableBtn.addEventListener("click", onEnableClick);

    if (typeof DeviceOrientationEvent === "undefined") {
      showHint("当前浏览器不支持方向传感器，请用 Safari 打开", "error");
      return;
    }

    // 每次打开都显示按钮，点击后才请求权限并绑定方向事件
    showEnableButton();
  }

  /* ---------- 演示模式（桌面预览） ---------- */
  function startDemoMode() {
    var d = 0;
    window.setInterval(function () {
      d = (d + 1) % 360;
      updateHeading(d);
    }, 40);
    renderPosition({ latitude: 39.90872, longitude: 116.39748, altitude: 44.2, accuracy: 10 });
  }

  function init() {
    if (demoMode) {
      startDemoMode();
    } else {
      startCompass();
    }
  }

  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("./sw.js").catch(function () {});
  }

  /* ---------- 安卓安装到桌面（PWA） ---------- */
  var installEls = {
    banner: document.getElementById("installBanner"),
    goBtn: document.getElementById("installGo"),
    closeBtn: document.getElementById("installClose"),
    sheet: document.getElementById("installSheet"),
    sheetBrowser: document.getElementById("installBrowserName"),
    sheetSteps: document.getElementById("installSteps"),
    sheetDone: document.getElementById("installDone")
  };

  var deferredInstallPrompt = null;
  var isStandaloneApp = (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) || window.navigator.standalone === true;
  var isAndroid = /android/i.test(navigator.userAgent);

  function installBannerClosed() {
    try { return window.sessionStorage.getItem("ttc-install-closed") === "1"; } catch (e) { return false; }
  }

  function showInstallBanner() {
    if (!isAndroid || isStandaloneApp || installBannerClosed()) { return; }
    installEls.banner.classList.add("visible");
  }

  function hideInstallBanner() {
    installEls.banner.classList.remove("visible");
  }

  function detectBrowserName() {
    var ua = navigator.userAgent;
    if (/MicroMessenger/i.test(ua)) { return "微信"; }
    if (/MQQBrowser/i.test(ua)) { return "QQ浏览器"; }
    if (/EdgA\//i.test(ua)) { return "Edge"; }
    if (/CriOS\//i.test(ua)) { return "Chrome"; }
    if (/Chrome\//i.test(ua)) { return "Chrome"; }
    if (/SamsungBrowser/i.test(ua)) { return "三星浏览器"; }
    if (/MiuiBrowser/i.test(ua)) { return "小米浏览器"; }
    if (/UCBrowser|UBrowser/i.test(ua)) { return "UC / 夸克"; }
    if (/Firefox\//i.test(ua)) { return "Firefox"; }
    return "当前浏览器";
  }

  function buildInstallSteps() {
    var name = detectBrowserName();
    var steps;
    if (name === "微信") {
      steps = [
        "点右上角「···」，选「在浏览器打开」",
        "在浏览器里点「菜单」（☰ / ⋮ / ···）",
        "选「安装应用 / 添加到主屏幕 / 添加到桌面」",
        "回到手机桌面，就能像 App 一样打开指南龟"
      ];
    } else if (name === "QQ浏览器") {
      steps = [
        "点底部或右上角「☰」菜单",
        "选「添加到主屏幕 / 添加到桌面」（部分版本在「设置 → 桌面快捷方式」里）",
        "回到手机桌面，就能像 App 一样打开指南龟"
      ];
    } else if (name === "Edge") {
      steps = [
        "点底部「···」菜单",
        "选「添加到手机 / 安装应用」",
        "回到手机桌面，就能像 App 一样打开指南龟"
      ];
    } else if (name === "Chrome") {
      steps = [
        "点右上角「⋮」菜单",
        "选「安装应用 / 添加到主屏幕」",
        "回到手机桌面，就能像 App 一样打开指南龟"
      ];
    } else {
      steps = [
        "打开浏览器「菜单」（☰ / ⋮ / ···）",
        "选「添加到主屏幕 / 添加到桌面 / 安装应用」",
        "回到手机桌面，就能像 App 一样打开指南龟"
      ];
    }
    return { name: name, steps: steps };
  }

  function openInstallSheet() {
    var info = buildInstallSteps();
    installEls.sheetBrowser.textContent = "已检测到：" + info.name;
    installEls.sheetSteps.innerHTML = "";
    info.steps.forEach(function (step) {
      var li = document.createElement("li");
      li.textContent = step;
      installEls.sheetSteps.appendChild(li);
    });
    installEls.sheet.classList.add("visible");
  }

  function closeInstallSheet() {
    installEls.sheet.classList.remove("visible");
  }

  installEls.goBtn.addEventListener("click", function () {
    if (deferredInstallPrompt) {
      deferredInstallPrompt.prompt();
      deferredInstallPrompt.userChoice.then(function (choice) {
        deferredInstallPrompt = null;
        hideInstallBanner();
        if (!choice || choice.outcome !== "accepted") {
          openInstallSheet();
        }
      });
    } else {
      hideInstallBanner();
      openInstallSheet();
    }
  });

  installEls.closeBtn.addEventListener("click", function () {
    hideInstallBanner();
    try { window.sessionStorage.setItem("ttc-install-closed", "1"); } catch (e) {}
  });

  installEls.sheetDone.addEventListener("click", function () {
    closeInstallSheet();
    try { window.sessionStorage.setItem("ttc-install-closed", "1"); } catch (e) {}
  });

  window.addEventListener("beforeinstallprompt", function (e) {
    e.preventDefault();
    deferredInstallPrompt = e;
    showInstallBanner();
  });

  window.addEventListener("appinstalled", function () {
    deferredInstallPrompt = null;
    hideInstallBanner();
  });

  if (isAndroid && !isStandaloneApp) {
    window.setTimeout(showInstallBanner, 2500);
  }

  init();
})();

  </script>
</body>
</html>
